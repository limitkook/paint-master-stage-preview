<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15242d"><title>Paint Master · 정원 스테이지</title><link rel="stylesheet" href="style.css?v=flat-v8-controls"></head>
<body><header><div><strong>Paint Master</strong><small id="stage-meta">정원 · 웹 체험판</small></div><button id="reset" title="진행률 초기화">↺</button></header>
<main><canvas id="board" aria-label="색칠 도안"></canvas><div id="loading" role="status">스테이지 불러오는 중…</div><div class="toolbar"><button id="minus" aria-label="축소">−</button><button id="fit">맞춤</button><button id="plus" aria-label="확대">＋</button><button id="hint">힌트 5</button></div><div id="progress" role="progressbar" aria-label="색칠 면적" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="fill"></div><span id="percent">0%</span></div><div id="toast" role="status"></div></main>
<footer><div id="palette" aria-label="색 팔레트"></div><p>색 선택 → 드래그로 색칠 · 작은 번호는 확대 · 두 손가락/우클릭 이동<br>Unity가 아닌 단일 스테이지 웹 체험판 · 새로고침하면 진행률 초기화</p></footer><script type="module" src="app.mjs?v=flat-v8-controls"></script></body></html>
