<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15242d"><title>Paint Master · 테스트 스테이지 1</title><link rel="stylesheet" href="style.css?v=material-v18-confined-pointer"></head>
<body><div id="stroke-error" role="status" aria-live="polite" hidden><span></span></div><header><div><strong>Paint Master</strong><small id="stage-meta">정원 · 웹 체험판</small></div><button id="debug-back" hidden>뒤로가기</button><button id="reset" title="진행률 초기화">↺</button></header>
<main><canvas id="board" aria-label="색칠 도안"></canvas><div id="loading" role="status">스테이지 불러오는 중…</div><div class="toolbar"><label class="brush-control">붓 <select id="brush-size" aria-label="붓 크기"><option value="0.5">작게</option><option value="1" selected>보통</option><option value="2">크게</option></select></label><button id="minus" aria-label="축소">−</button><button id="fit">맞춤</button><button id="plus" aria-label="확대">＋</button><button id="hint">힌트 5</button></div><section id="painting-hud" aria-label="색칠 진행 상황"><div class="hud-heading"><span>그림 전체</span><span id="colour-count">완료 색 0 / 27</span></div><div id="progress" role="progressbar" aria-label="색칠 면적" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="fill"></div><span id="percent">0%</span></div><div id="region-hud" class="hud-local"><span id="region-caption">현재 칸 · —</span><strong id="region-percent">—</strong><div id="region-track"><div id="region-fill"></div></div></div><div class="hud-colour"><i id="colour-swatch"></i><span id="colour-status">선택 색 · 0 / 0칸</span></div></section><div id="clear-banner" role="status" aria-live="polite" hidden>클리어!</div><div id="toast" role="status"></div></main>
<footer><div id="palette" aria-label="색 팔레트"></div><p>색 선택 → 드래그로 색칠 · 작은 번호는 확대 · 두 손가락/우클릭 이동<br>Unity가 아닌 단일 스테이지 웹 체험판 · 새로고침하면 진행률 초기화</p></footer><script type="module" src="app.mjs?v=material-v18-confined-pointer"></script><section id="debug-lobby" hidden><div class="qa-card"><h2>테스트 로비</h2><p id="qa-message">현재 진행률은 유지됩니다.</p><input id="debug-code" inputmode="numeric" maxlength="9" autocomplete="off" aria-label="테스트 코드" placeholder="키보드 입력"><div id="qa-actions" hidden><p class="qa-warning">QA 조작 · 정상 플레이 검증 아님</p><div class="qa-grid"><button data-qa="all">모두 색칠</button><button data-qa="except">한 칸만 남기기</button><button data-qa="one">현재 칸 완료</button><button data-qa="empty">현재 칸 초기화</button><button data-qa="97">현재 칸 97%</button><button data-qa="numbers">번호 항상 표시</button><button data-qa="reset">전체 초기화</button><button data-qa="report">QA 상태 저장</button></div></div><button id="qa-return">게임으로 돌아가기</button></div></section></body></html>
